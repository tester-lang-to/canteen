<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Points Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      background: #0f766e;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    pre {
      background: #f1f5f9;
      padding: 15px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<h2>Admin Points Test</h2>

<label>Student ID</label>
<input
  id="studentId"
  type="number"
  placeholder="Example: 1"
>

<label>Points to Add</label>
<input
  id="points"
  type="number"
  step="0.01"
  placeholder="Example: 100"
>

<label>Reason</label>
<textarea
  id="reason"
  placeholder="Example: Monthly meal allowance"
></textarea>

<button id="submitButton">
  Add Points
</button>

<pre id="result">Ready.</pre>

<script>

document
  .getElementById("submitButton")
  .addEventListener("click", async () => {

    const studentId =
      Number(document.getElementById("studentId").value);

    const points =
      Number(document.getElementById("points").value);

    const reason =
      document.getElementById("reason").value.trim();

    const result =
      document.getElementById("result");

    result.textContent = "Processing...";

    try {

      const response = await fetch(
        "/api/admin/points/add",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          credentials: "same-origin",

          body: JSON.stringify({
            studentId,
            points,
            reason
          })
        }
      );

      const data = await response.json();

      result.textContent =
        JSON.stringify(data, null, 2);

    } catch (error) {

      result.textContent =
        "Request failed: " + error.message;

    }

  });

</script>

</body>
</html>
